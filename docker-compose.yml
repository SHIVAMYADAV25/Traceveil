
services:
  mongodb:
    image: mongo:8
    container_name: sniffer-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: change_this_password
      MONGO_INITDB_DATABASE: snifferX

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Community service database. Separate from MongoDB: no shared data, users or credentials.
  community-db:
    image: postgres:16
    container_name: sniffer-community-db
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community_dev   # development only. Change it, and DATABASE_URL, before deploying.
      POSTGRES_DB: community

    volumes:
      - community_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  community_db_data:
